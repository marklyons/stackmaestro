<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3f8f"/>
      <stop offset="100%" stop-color="#1b1e4a"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ea8ff"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="210" fill="url(#bg)"/>

  <!-- bottom bar, widest, dimmest: trunk most -->
  <rect x="210" y="636" width="604" height="118" rx="30" fill="#ffffff" opacity="0.28"/>
  <circle cx="176" cy="695" r="15" fill="#ffffff" opacity="0.5"/>

  <!-- middle bar -->
  <rect x="246" y="472" width="532" height="118" rx="30" fill="#ffffff" opacity="0.6"/>
  <circle cx="176" cy="531" r="15" fill="#ffffff" opacity="0.75"/>

  <!-- top bar, narrowest, brightest: the tip -->
  <rect x="282" y="308" width="460" height="118" rx="30" fill="url(#bar3)"/>
  <circle cx="176" cy="367" r="17" fill="#6ea8ff"/>

  <!-- connecting spine -->
  <rect x="169" y="367" width="14" height="328" fill="#ffffff" opacity="0.35"/>
</svg>
